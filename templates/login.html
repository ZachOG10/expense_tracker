<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In — PivotSpend</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2128;
            --surface-light: #232b33;
            --border: #2d3640;
            --text: #e4e9ee;
            --text-dim: #8b96a3;
            --orange: #e2883f;
            --orange-dim: #c06f2d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .brand span { color: var(--orange); }

        .login-box h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-box p.subtitle {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .error {
            background: rgba(91, 155, 213, 0.12);
            border: 1px solid #5b9bd5;
            color: #5b9bd5;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 14px;
        }

        .field input:focus {
            outline: none;
            border-color: var(--orange);
        }

        button {
            width: 100%;
            background: var(--orange);
            color: #0f1419;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover { background: var(--orange-dim); }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .footer-link a { color: var(--orange); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand">Pivot<span>Spend</span></div>
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to see where your money went.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Log In</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>
    </div>
</body>
</html>
